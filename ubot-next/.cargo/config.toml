[build]
target = "thumbv7em-none-eabihf"

[target.thumbv7em-none-eabihf]
runner = [
  "probe-rs",
  "run",
  "--chip=nRF52840_xxAA",
  "--always-print-stacktrace",
  "--log-format={t} {[{L}]%bold} {s}  {{c} {ff}:{l:1}%dimmed}"
]

# rustflags = [
#  "-C", "link-arg=-Tlink.x",
#  "-C", "link-arg=-Tdefmt.x",
#  "-C", "force-frame-pointers",
#]

rustflags = [
  "-C", "force-frame-pointers",
]

[env]
DEFMT_LOG = "trace"
