[package]
name = "ubot-next"
version = "2.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "nRF52840 Embassy tracked robot controlled by a game controller relayed over BLE from an iOS companion app"
publish = false

[dependencies]
embassy-executor = { version = "0.10.0", features = ["defmt", "platform-cortex-m", "executor-thread", "executor-interrupt", "embassy-time-driver"] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-nrf = { version = "0.11", features = ["defmt", "nrf52840", "time-driver-rtc1", "gpiote", "unstable-pac"] }
embassy-sync = { version = "0.8" }
embassy-futures = { version = "0.1.2" }
nrf-softdevice = { git = "https://github.com/embassy-rs/nrf-softdevice", features = [
  # "defmt",
  "nrf52840",
  "s140",
  "ble-peripheral",
  "ble-gatt-server",
  "critical-section-impl",
] }
nrf-softdevice-s140 = { git = "https://github.com/embassy-rs/nrf-softdevice" }

defmt = "1.1.0"
defmt-rtt = "1.3"
panic-probe = { version = "1", features = ["print-defmt"] }

cortex-m = { version = "0.7" }
cortex-m-rt = "0.7"

static_cell = "2"
heapless = "0.9.3"
bitflags = { version = "2", default-features = false }

[profile.release]
debug = 2
lto = true
opt-level = "s"
incremental = false
codegen-units = 1

[profile.dev]
debug = 2
opt-level = 1
